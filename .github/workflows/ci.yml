name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release of this commit (tag v<project version>)"
        type: boolean
        default: false

# File names carry the version (scripts/version_label.sh): a release is
# Cadjitsu-1.0.0-macOS.dmg, any other build Cadjitsu-1.0.1-dev.<run>-macOS.dmg.
env:
  RELEASE: ${{ (github.event_name == 'workflow_dispatch' && inputs.release) && '1' || '0' }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (conda-forge, Xvfb)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        shell: bash
        run: scripts/version_label.sh --github

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: env/environment.yml
          environment-name: cadjitsu
          cache-environment: true

      - name: Install Xvfb and Mesa
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11-utils libgl1-mesa-dri libglx-mesa0 libegl-mesa0

      - name: Configure
        run: CADJITSU_ENV="$CONDA_PREFIX" cmake --preset linux-conda -DCADJITSU_BUILD_LABEL="$CADJITSU_LABEL"

      - name: Build
        run: cmake --build --preset linux-conda

      - name: Core tests
        run: ctest --preset linux-conda -L core

      - name: App tests
        run: ctest --preset linux-conda -L app

      - name: Plugin, skill, MCP tool reference and icon set
        run: |
          # The committed SVGs are what the icon generator makes.
          python3 scripts/icons/gen_icons.py
          git diff --exit-code --stat resources/icons
          python3 scripts/check_plugin.py
          scripts/run_xvfb.sh build/linux/src/app/Cadjitsu --mcp-tools > out-tools.json
          python3 scripts/gen_mcp_tool_docs.py --check out-tools.json plugins/cadjitsu/skills/cadjitsu-cad/references/tools.md

      - name: Self tests
        run: |
          for t in $(scripts/run_xvfb.sh build/linux/src/app/Cadjitsu --list-selftests); do
            scripts/run_xvfb.sh build/linux/src/app/Cadjitsu --selftest=$t --out out/linux
          done

      - name: Package Cadjitsu for Linux
        run: |
          python3 scripts/package_linux.py build/linux "$CONDA_PREFIX" "$CADJITSU_LABEL" out/package
          echo "CONDA_ENV_DIR=$CONDA_PREFIX" >> "$GITHUB_ENV"

      - name: Test the Linux package (conda environment hidden)
        shell: bash
        run: |
          # The package has to run without the environment it was built in.
          mv "$CONDA_ENV_DIR" "$CONDA_ENV_DIR.hidden"
          trap 'mv "$CONDA_ENV_DIR.hidden" "$CONDA_ENV_DIR"' EXIT
          mkdir -p out/unpacked
          tar -xzf "out/package/Cadjitsu-$CADJITSU_LABEL-Linux-x86_64.tar.gz" -C out/unpacked
          app="$PWD/out/unpacked/Cadjitsu-$CADJITSU_LABEL-Linux-x86_64/cadjitsu"
          for t in smoke acceptance render; do
            scripts/run_xvfb.sh env -i DISPLAY=:99 HOME="$HOME" PATH=/usr/bin:/bin LANG=C.UTF-8 \
              LIBGL_ALWAYS_SOFTWARE=1 __GLX_VENDOR_LIBRARY_NAME=mesa QT_XCB_GL_INTEGRATION=xcb_glx \
              "$app" --selftest=$t --out out/linux-package
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-selftest-screenshots
          path: |
            out/linux
            out/linux-package
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: Cadjitsu-${{ env.CADJITSU_LABEL }}-Linux-x86_64
          path: out/package/Cadjitsu-${{ env.CADJITSU_LABEL }}-Linux-x86_64.tar.gz
          compression-level: 0

  macos:
    name: macOS Apple Silicon (Homebrew, Metal)
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        run: scripts/version_label.sh --github

      - name: Install dependencies
        run: |
          brew install --quiet qtbase qtsvg qtshadertools opencascade eigen embree open-image-denoise ninja
          brew list --versions qtbase qtshadertools opencascade eigen embree open-image-denoise

      - name: Configure
        run: cmake --preset macos-brew -DCADJITSU_BUILD_LABEL="$CADJITSU_LABEL"

      - name: Build
        run: cmake --build --preset macos-brew

      - name: Core tests
        run: ctest --preset macos-brew -L core

      - name: App tests
        run: ctest --preset macos-brew -L app

      - name: Self tests (Metal)
        run: |
          for t in $(build/macos/src/app/Cadjitsu.app/Contents/MacOS/Cadjitsu --list-selftests); do
            build/macos/src/app/Cadjitsu.app/Contents/MacOS/Cadjitsu --selftest=$t --out out/macos
          done

      - name: Bundle Cadjitsu.app
        run: |
          cp -R build/macos/src/app/Cadjitsu.app out/Cadjitsu.app
          "$(brew --prefix qtbase)/bin/macdeployqt" out/Cadjitsu.app -always-overwrite
          # Whatever macdeployqt left pointing at Homebrew is copied in and re-pointed;
          # fails if anything still resolves outside the bundle.
          python3 scripts/macos_bundle_fix.py out/Cadjitsu.app
          codesign --force --deep --sign - out/Cadjitsu.app
          plutil -lint out/Cadjitsu.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' out/Cadjitsu.app/Contents/Info.plist)" = Cadjitsu.icns
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:CFBundleTypeName' out/Cadjitsu.app/Contents/Info.plist
          test -s out/Cadjitsu.app/Contents/Resources/Cadjitsu.icns
          test -d out/Cadjitsu.app/Contents/Frameworks/QtSvg.framework
          vtool -show-build out/Cadjitsu.app/Contents/MacOS/Cadjitsu | grep -E 'minos|sdk' || true

      - name: Acceptance test of the bundled app (Homebrew hidden)
        run: |
          # The bundle has to run on a Mac without Homebrew: hide it meanwhile.
          sudo mv /opt/homebrew /opt/homebrew.hidden
          trap 'sudo mv /opt/homebrew.hidden /opt/homebrew' EXIT
          status=0
          out/Cadjitsu.app/Contents/MacOS/Cadjitsu --selftest=acceptance --out out/macos-bundled || status=$?
          # The icons (QtSvg) render from the bundle too.
          out/Cadjitsu.app/Contents/MacOS/Cadjitsu --selftest=icons --out out/macos-bundled || status=$?
          # The path tracer and its denoiser (loaded at run time) from the bundle.
          out/Cadjitsu.app/Contents/MacOS/Cadjitsu --selftest=render --out out/macos-bundled || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::group::Backtrace and loaded images"
            lldb --batch -o run -k "thread backtrace all" -k "image list" -- \
              out/Cadjitsu.app/Contents/MacOS/Cadjitsu --selftest=acceptance --out out/macos-bundled-lldb || true
            echo "::endgroup::"
          fi
          exit "$status"

      # A disk image, not a zip: upload-artifact zips every artifact itself (a
      # zip inside would come out double-zipped), and an app bundle uploaded
      # as loose files loses its symlinks and executable bits.
      - name: Make the disk image
        run: |
          mkdir -p out/dmg
          cp -R out/Cadjitsu.app out/dmg/
          ln -s /Applications out/dmg/Applications
          # hdiutil can fail with "Resource busy" while the system still scans
          # the freshly written bundle: wait and try again.
          for attempt in 1 2 3 4; do
            hdiutil create -volname "Cadjitsu $CADJITSU_LABEL" -srcfolder out/dmg -format UDZO -ov \
              "out/Cadjitsu-$CADJITSU_LABEL-macOS.dmg" && break
            [ "$attempt" -eq 4 ] && exit 1
            echo "hdiutil failed (attempt $attempt); retrying"
            sleep $((attempt * 10))
          done

      - name: Test the app from the disk image (Homebrew hidden)
        run: |
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "out/Cadjitsu-$CADJITSU_LABEL-macOS.dmg"
          test -L "$mnt/Applications"
          cp -R "$mnt/Cadjitsu.app" out/from-dmg.app
          hdiutil detach "$mnt"
          sudo mv /opt/homebrew /opt/homebrew.hidden
          trap 'sudo mv /opt/homebrew.hidden /opt/homebrew' EXIT
          out/from-dmg.app/Contents/MacOS/Cadjitsu --selftest=smoke --out out/macos-dmg

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-selftest-screenshots
          path: |
            out/macos
            out/macos-bundled
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: Cadjitsu-${{ env.CADJITSU_LABEL }}-macOS
          path: out/Cadjitsu-${{ env.CADJITSU_LABEL }}-macOS.dmg
          compression-level: 0

  # A v* tag, or a manual run with "release" ticked, publishes a GitHub release
  # of the two downloads (the tag is made if it is not there yet).
  release:
    name: GitHub release
    needs: [linux, macos]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        id: v
        run: scripts/version_label.sh --github

      - uses: actions/download-artifact@v4
        with:
          pattern: Cadjitsu-${{ steps.v.outputs.label }}-*
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.v.outputs.version }}"
          ls -l dist
          test -s "dist/Cadjitsu-$version-macOS.dmg"
          test -s "dist/Cadjitsu-$version-Linux-x86_64.tar.gz"
          notes="docs/releases/$version.md"
          test -s "$notes"
          gh release create "v$version" dist/* --title "Cadjitsu $version" --notes-file "$notes" --target "$GITHUB_SHA"
